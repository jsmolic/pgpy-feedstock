schema_version: 1

context:
  name: pgpy
  version: "0.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/PGPy-${{ version }}.tar.gz
  sha256: bdd3da1e006fc8e81cc02232969924d6e8c98a4af1621a925d99bba09164183b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - cryptography >=2.6
    - pyasn1
    - python >=${{ python_min }}
    - six >=1.9.0

tests:
  - python:
      imports:
        - pgpy
        - pgpy.packet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Pretty Good Privacy for Python
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/SecurityInnovation/PGPy

extra:
  recipe-maintainers:
    - declanjscott
