schema_version: 1

context:
  version: 0.6.0

package:
  name: pgpy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f8/68/5e285ba9465550a48e837b08b27fa99ef238618f6085a1464afaa4dc8426/PGPy-0.6.0.tar.gz
  sha256: 279c2e353f4c3a319f00bd9bd582456e420f8a3ac6de2b4e9731444746828383

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - wheel
  run:
    - cryptography >=3.3.2
    - pyasn1
    - python >=${{ python_min }},<3.13

tests:
  - python:
      imports:
        - pgpy
        - pgpy.packet
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Pretty Good Privacy for Python
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/SecurityInnovation/PGPy

extra:
  recipe-maintainers:
    - declanjscott
